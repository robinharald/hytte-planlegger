# Publish to GitHub Pages on every push to main (and on demand).
# One-time repository setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# vite.config.ts uses a relative base ('./'), so the same build works at https://<user>.github.io/hytte-planlegger/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel a running one (Pages deployments must finish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (gate the deployment)
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - name: Upload dist as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
